[project]
name = "epluribus"
version = "0.1.0"
description = "Sample LLMs many times on a structured question and summarize the answers by type."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cldixon" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
]
keywords = ["llm", "sampling", "structured-outputs", "simulation", "polling", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.12,<3"]
openai = ["openai>=3.57,<4"]
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/cldixon/epluribus"
Documentation = "https://cldixon.github.io/epluribus/"
Repository = "https://github.com/cldixon/epluribus"
Issues = "https://github.com/cldixon/epluribus/issues"
Changelog = "https://github.com/cldixon/epluribus/releases"

[dependency-groups]
dev = [
    "anthropic>=2.12,<3",
    "openai>=3.57,<4",
    "pandas>=2.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "ty>=0.0.80",
]
docs = [
    "zensical>=0.0.67",
    "mkdocstrings-python>=1.18",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["design"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "PL", "PERF", "S", "DTZ", "PTH", "RET",
]
ignore = [
    "PLR0913",  # Keyword-heavy public signatures are intentional.
    "PLR2004",
    "S311",     # Sampling randomness, not cryptography.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415"]
"examples/**" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
exclude = ["design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: calls real provider APIs (needs API keys and costs money)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["epluribus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

name: Live API

# Calls the real provider APIs and costs a few cents per run, so it only runs by hand.
# Add ANTHROPIC_API_KEY and/or OPENAI_API_KEY as repository secrets; tests for a
# provider without a key are skipped.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --group dev
      - name: Fail if no key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY$OPENAI_API_KEY" || {
            echo "::error::Set ANTHROPIC_API_KEY and/or OPENAI_API_KEY as repository secrets."
            exit 1
          }
      - run: uv run pytest -m live -v -rs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
